{% set name = "palmerpenguins" %}
{% set version = "0.1.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/palmerpenguins-{{ version }}.tar.gz
  sha256: 1b4435223db40925e8e0a4cf2a86a8bbf85d565d2743ada9f6bac6c037835c02

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pandas
    - numpy

test:
  imports:
    - palmerpenguins
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mcnakhaee/palmerpenguins
  summary: A python package for the palmer penguins dataset
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
